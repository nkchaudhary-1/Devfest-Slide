<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0E0D">
<title>Exploration with AI — Google DevFest 2026</title>

<style>
/* ───────── Theme ─────────
   Three colour blocks. Change a hex and every slide using it updates.
   Which slide gets which block is the `look` array in the script. */
:root{
  --head:'Boldonse','Bricolage Grotesque','Arial Black',Impact,sans-serif;
  --display:'Bricolage Grotesque','Archivo Black','Arial Black',Impact,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --expo:cubic-bezier(.16,1,.3,1);
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="ink"]{
  --bg:#0C0C0B; --fg:#F4F0E6; --soft:#D6D2C7; --muted:#D0CCC1;
  --accent:#FF5A2B; --accent-s:#FF5A2B; --hair:rgba(244,240,230,.16);
  --panel:#F4F0E6; --panel-fg:#0E0E0D; --panel-label:#C42E03;
}
[data-theme="paper"]{
  --bg:#F4F0E6; --fg:#0E0E0D; --soft:#2E2D2A; --muted:#5E5A51;
  --accent:#E5390A; --accent-s:#C42E03; --hair:rgba(14,14,13,.16);
  --panel:#0E0E0D; --panel-fg:#F4F0E6; --panel-label:#FF5A2B;
}
[data-theme="fire"]{
  --bg:#F9421A; --fg:#0E0E0D; --soft:#1A1816; --muted:#1A1816;
  --accent:#F4F0E6; --accent-s:#0E0E0D; --hair:rgba(14,14,13,.24);
  --panel:#0E0E0D; --panel-fg:#F4F0E6; --panel-label:#FF5A2B;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--display);font-weight:500;color:#F4F0E6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal}
body.idle{cursor:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ───────── Stage: fixed 1280×720, scaled to fit ───────── */
#stage{
  position:absolute;left:50%;top:50%;
  width:1280px;height:720px;margin:-360px 0 0 -640px;
  background:var(--bg);color:var(--fg);overflow:hidden;
  transform-origin:50% 50%;
}

/* ───────── Slide ───────── */
.slide{
  position:absolute;inset:0;background:var(--bg);color:var(--fg);
  --k:1;
  animation:bgin 460ms ease both;
}
.wrap{
  position:absolute;inset:0;padding:54px 88px 0;
  display:flex;flex-direction:column;
  animation:shift 640ms var(--expo) both;
}

/* halftone texture layer (painted by JS, no image files) */
.tex{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* word-mask reveal: each word rises out of its own clipped line */
.w{
  display:inline-block;overflow:hidden;vertical-align:top;white-space:nowrap;text-indent:0;
  padding:.17em .06em .24em;margin:-.17em -.06em -.24em;
}
.wi{
  display:inline-block;
  animation:up 820ms var(--expo) both;
  animation-delay:calc(var(--d,0) * 1ms + 120ms);
}

.kicker{
  font-family:var(--mono);font-weight:700;font-size:calc(20px * var(--k));line-height:1.1;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent-s);
}
.kicker .w{padding-bottom:.3em;margin-bottom:-.3em}
.main{
  flex:1;min-height:0;
  margin:22px 0 98px;
  display:flex;flex-direction:column;justify-content:center;
}
.stack{display:flex;flex-direction:column;align-items:flex-start;width:100%}

.headline{
  font-family:var(--head);font-weight:400;text-transform:uppercase;
  font-size:calc(var(--h) * var(--k));line-height:1.38;
  letter-spacing:-.004em;word-spacing:.08em;color:var(--fg);
  text-wrap:balance;overflow-wrap:break-word;
}
.headline .s{white-space:nowrap}
.headline .hl{color:var(--accent)}

.sub{
  margin-top:calc(30px * var(--k));max-width:980px;
  font-weight:500;font-size:calc(36px * var(--k));line-height:1.28;letter-spacing:-.012em;color:var(--soft);
  text-wrap:pretty;
}

/* list: mono index, heavy text */
.list{list-style:none;margin-top:calc(42px * var(--k));display:flex;flex-direction:column;gap:calc(14px * var(--k))}
.list li{display:flex;align-items:baseline;gap:calc(22px * var(--k))}
.list .n{
  font-family:var(--mono);font-weight:700;font-size:calc(22px * var(--k));line-height:1;color:var(--accent-s);
  flex:none;width:calc(46px * var(--k));
}
.list .t{font-weight:700;font-size:calc(42px * var(--k));line-height:1.1;letter-spacing:-.022em;color:var(--fg);text-wrap:pretty}

/* "For example" aside — a solid highlighted block */
.example{
  margin-top:calc(36px * var(--k));max-width:880px;
  background:var(--panel);color:var(--panel-fg);border-radius:18px;
  padding:calc(22px * var(--k)) calc(32px * var(--k)) calc(28px * var(--k));
}
.example .label{
  display:block;margin-bottom:calc(12px * var(--k));
  font-family:var(--mono);font-weight:700;font-size:calc(17px * var(--k));line-height:1.2;
  letter-spacing:.1em;text-transform:uppercase;color:var(--panel-label);
}
.example .body{display:block;font-weight:600;font-size:calc(31px * var(--k));line-height:1.26;letter-spacing:-.012em;text-wrap:pretty}

/* list + example side by side */
.row{display:grid;grid-template-columns:1.3fr 1fr;gap:52px;align-items:start;width:100%;margin-top:calc(36px * var(--k))}
.row .list,.row .example{margin-top:0}
.row .list .t{font-size:calc(36px * var(--k))}

/* prompt block — distinct, quotable, with hanging quote marks */
.prompt{
  margin-top:calc(38px * var(--k));width:100%;
  background:var(--panel);color:var(--panel-fg);border-radius:22px;
  padding:calc(40px * var(--k)) calc(52px * var(--k)) calc(44px * var(--k));
}
.prompt p{
  font-weight:600;font-size:calc(35px * var(--k));line-height:1.3;letter-spacing:-.014em;
  padding-left:.56em;text-indent:-.56em;
}
.prompt p::before{content:"\201C";display:inline-block;width:.56em;text-indent:0;color:var(--panel-label);font-weight:800}
.prompt p::after{content:"\201D";color:var(--panel-label);font-weight:800;margin-left:-.02em}

/* big list */
.biglist{list-style:none;display:flex;flex-direction:column;gap:calc(2px * var(--k))}
.biglist li{
  font-family:var(--head);font-weight:400;text-transform:uppercase;
  font-size:calc(var(--h) * var(--k));line-height:1.4;letter-spacing:-.004em;word-spacing:.08em;color:var(--fg);white-space:nowrap;
}
.biglist li:last-child{color:var(--accent)}

.foot{
  position:absolute;left:88px;right:300px;bottom:44px;
  font-weight:600;font-size:calc(26px * var(--k));line-height:1.3;letter-spacing:-.006em;color:var(--muted);
}

/* QR tile (final slide) */
.qr{
  position:absolute;right:88px;top:50%;margin-top:-190px;width:380px;height:380px;
  border-radius:22px;overflow:hidden;
  animation:qrin 900ms var(--expo) 520ms both;
}
.qr svg{display:block;width:100%;height:100%}
.qr .bg{fill:#F4F0E6}
.qr .fg{fill:#0E0E0D}
.slide[data-qr] .stack{width:668px}
.slide[data-qr] .sub{max-width:668px}

/* ───────── Motion: calm, one language ───────── */
@keyframes qrin{from{opacity:0;transform:translateY(24px)}}
@keyframes bgin{from{opacity:0}}
@keyframes shift{from{transform:translateY(16px)}}
@keyframes up{from{transform:translateY(118%)}}
@keyframes fade{from{opacity:0}}
@keyframes roll{from{transform:translateY(100%)}}

/* ───────── Quiet UI ───────── */
#bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--hair)}
#fill{display:block;height:100%;width:100%;background:var(--fg);transform-origin:0 50%;transform:scaleX(0);transition:transform 700ms var(--expo)}
#ui{
  position:absolute;right:40px;bottom:22px;display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.04em;color:var(--muted);
  transition:color .4s;
}
#count{min-width:96px;text-align:center;opacity:.6;transition:opacity .3s;white-space:nowrap}
#count .roll{display:inline-block;overflow:hidden;vertical-align:bottom;height:1.25em;line-height:1.25}
#count .rollin{display:inline-block;animation:roll 700ms var(--expo) both}
#ui button{
  width:44px;height:44px;border-radius:50%;font-family:var(--display);font-size:30px;line-height:1;color:var(--fg);
  opacity:0;transition:opacity .3s,background .2s;
}
#ui button:hover{background:var(--hair)}
#ui button:disabled{visibility:hidden}
body.active #ui button{opacity:.75}
body.active #ui button:hover{opacity:1}
body.active #count{opacity:1}
#toast{
  position:absolute;left:50%;bottom:64px;transform:translateX(-50%);
  font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);
  opacity:0;transition:opacity .25s;pointer-events:none;
}
#toast.show{opacity:1}

/* ═════════ LOADER — the one place motion gets bold ═════════ */
#loader{
  position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--fg);
  overflow:hidden;cursor:pointer;
}
#loader.wipe{transform:translateY(-100%);transition:transform 360ms cubic-bezier(.7,0,.2,1)}
#loader.wipe.fast{transition-duration:200ms}
#ldfx{position:absolute;inset:0;background:var(--accent);opacity:0;pointer-events:none}
#ldfx.on{opacity:1}
#ldstage{
  position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;
  transform-origin:50% 50%;
}
#ldhud{position:absolute;left:88px;top:40px;display:flex;align-items:center;gap:18px;font-family:var(--mono);font-weight:700;font-size:22px;line-height:1}
#ldcount{min-width:3ch}
#ldbarw{position:relative;display:block;width:240px;height:4px;background:var(--hair)}
#ldbarw i{position:absolute;inset:0;background:var(--fg);transform-origin:0 50%;transform:scaleX(0)}

.ldbig{
  font-family:var(--head);font-weight:400;letter-spacing:-.004em;line-height:1.36;
  text-transform:uppercase;white-space:nowrap;
}
#ldflash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;visibility:hidden}
#ldflash.on{visibility:visible}
#ldflash span{display:inline-block;padding:0 .04em}
#ldflash.c0,#ldflash.c1,#ldflash.c3{color:var(--fg)}
#ldflash.c2{color:var(--accent)}

#ldmain{position:absolute;left:88px;right:88px;top:56px;height:400px}
#ldtitle,#ldend{position:absolute;left:0;top:50%;transform:translateY(-50%)}
#ldtitle .tw{display:inline-block;visibility:hidden;transform-origin:0 100%}
#ldtitle .tw+.tw{margin-left:.2em}
#ldtitle .tw.on{visibility:visible}
#ldtitle .tw.hl{color:var(--accent)}
#ldend{visibility:hidden}
#ldend.on{visibility:visible}
.slam{animation:slam 120ms linear both}
@keyframes slam{from{transform:scale(1.045)}}
.gone{display:none !important}

.ldk,.ldp,.ldn{position:absolute;left:88px;visibility:hidden}
.ldk.on,.ldp.on,.ldn.on{visibility:visible}
.ldk{top:470px;font-family:var(--mono);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-s)}
.ldp{top:512px;width:1040px;font-weight:600;font-size:36px;line-height:1.2;letter-spacing:-.012em;color:var(--soft)}
.ldn{top:622px;font-family:var(--mono);font-weight:700;font-size:21px;line-height:1.2;letter-spacing:.06em;color:var(--fg)}
.ldn .nm{text-transform:uppercase}

#ldticker{position:absolute;left:0;right:0;bottom:22px;height:20px;overflow:hidden;white-space:nowrap}
#ldticker .track{display:inline-flex;animation:tick 26s linear infinite}
#ldticker .tk{flex:none;font-family:var(--mono);font-weight:700;font-size:15px;line-height:20px;letter-spacing:.14em;color:var(--muted)}
@keyframes tick{to{transform:translateX(-50%)}}

/* ───────── Portrait: phones and tablets held upright get a taller 720×1280 stage ───────── */
body.portrait .wrap{padding:60px 56px 0}
body.portrait .main{margin:26px 0 130px}
body.portrait .foot{left:56px;right:56px;bottom:58px}
body.portrait .sub,body.portrait .example{max-width:100%}
body.portrait .headline .s{white-space:normal}
body.portrait .biglist li{white-space:normal}
body.portrait .row{grid-template-columns:1fr;gap:30px}
body.portrait .slide[data-qr] .stack{width:100%}
body.portrait .slide[data-qr] .main{margin-bottom:560px}
body.portrait .qr{left:56px;right:auto;top:auto;bottom:170px;margin:0;width:380px;height:380px}
body.portrait #ui{right:24px;bottom:26px}

/* ───────── Reduced motion: plain fades, static loader ───────── */
@media (prefers-reduced-motion:reduce){
  .slide{animation:fade 200ms linear both}
  .wrap{animation:none}
  .wi{animation:fade 200ms linear both;animation-delay:0s}
  #count .rollin{animation:none}
  #fill{transition:none}
  #loader.wipe{transform:none;opacity:0;transition:opacity 160ms linear}
  #ldticker .track{animation:none}
  .slam{animation:none}
  .qr{animation:fade 200ms linear both}
}
</style>

    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const ss = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  function paintTexture(cv, theme, seed, W = 1280, H = 720) {
    const SC = 2, P = 5, sx = W / 1280, sy = H / 720;
    cv.width = W * SC; cv.height = H * SC;
    const g = cv.getContext('2d');
    if (!g) return;
    const pal = TEX[theme] || TEX.ink, r = rng(seed * 7919 + 13);
    const fx = seed % 2 === 1, fy = (seed >> 1) % 2 === 1;
    const base = [
      { x: 40,   y: 60,  a: -58, s: 70,  A: .80, L: 760, k: .0006 },
      { x: 820,  y: 690, a: -30, s: 110, A: .34, L: 600, k: -.0004 },
      { x: 1230, y: 40,  a: 76,  s: 80,  A: .14, L: 360, k: .0005 },
    ];
    const bands = base.map((b) => {
      let a = b.a; if (fx) a = 180 - a; if (fy) a = -a;
      const t = a * Math.PI / 180;
      return { x: (fx ? W - b.x * sx : b.x * sx) + (r() - .5) * 140 * sx, y: (fy ? H - b.y * sy : b.y * sy) + (r() - .5) * 100 * sy,
               c: Math.cos(t), n: Math.sin(t), s2: 2 * b.s * b.s, L2: 2 * b.L * b.L, A: b.A, k: fx !== fy ? -b.k : b.k };
    });
    const ph = r() * 6.28;
    /* brightness 0..~.5; calmer in the middle where the text lives, glowing toward the edges */
    const field = (x, y) => {
      let f = 0;
      for (const b of bands) {
        const dx = x - b.x, dy = y - b.y, u = dx * b.c + dy * b.n, v = -dx * b.n + dy * b.c - b.k * u * u;
        f += b.A * Math.exp(-(v * v) / b.s2 - (u * u) / b.L2) * (1 + .12 * Math.sin(v * .085 + ph));
      }
      const inner = ss(30 * sx, 200 * sx, x) * (1 - ss(W - 210 * sx, W - 30 * sx, x)) * ss(20, 130, y) * (1 - ss(H - 130, H - 20, y));
      return Math.min(.28, .02 + f * (1 - .66 * inner) * pal.amp);
    };
    /* soft haze under the dots */
    const gw = Math.round(96 * (W > H ? 1 : .5625)), gh = Math.round(54 * (W > H ? 1 : 1.7778)), small = document.createElement('canvas');
    small.width = gw; small.height = gh;
    const sg = small.getContext('2d'), id = sg.createImageData(gw, gh), c = pal.dot.split(',').map(Number);
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
      const f = field((i + .5) * W / gw, (j + .5) * H / gh), o = (j * gw + i) * 4;
      id.data[o] = c[0]; id.data[o + 1] = c[1]; id.data[o + 2] = c[2]; id.data[o + 3] = Math.min(255, f * 90);
    }
    sg.putImageData(id, 0, 0);
    g.imageSmoothingEnabled = true;
    g.drawImage(small, 0, 0, W * SC, H * SC);
    /* the dot screen: size and opacity both rise with the light (8 opacity steps, one path each) */
    g.scale(SC, SC);
    const STEPS = 8, paths = [];
    for (let k = 0; k < STEPS; k++) paths.push(new Path2D());
    for (let row = 0, y = P / 2; y < H + P; y += P, row++) {
      for (let x = (row % 2 ? P : P / 2); x < W + P; x += P) {
        const f = field(x, y), t = Math.min(1, f / .34);
        const rad = P * (.13 + .31 * Math.sqrt(t));
        const path = paths[Math.min(STEPS - 1, Math.floor(t * STEPS))];
        path.moveTo(x + rad, y); path.arc(x, y, rad, 0, 6.2832);
      }
    }
    for (let k = 0; k < STEPS; k++) {
      g.fillStyle = 'rgba(' + pal.dot + ',' + (.10 + .62 * (k + .5) / STEPS).toFixed(3) + ')';
      g.fill(paths[k]);
    }
  }

  /* QR code as inline SVG: crisp at any projector resolution, with the 4-module quiet zone scanners need */
  function qrTile() {
    const NS = 'http://www.w3.org/2000/svg', n = window.QR.n, z = 4, box = n + 2 * z;
    const t = el('div', 'qr');
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', (-z) + ' ' + (-z) + ' ' + box + ' ' + box);
    svg.setAttribute('shape-rendering', 'crispEdges');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'QR code to connect with Neelesh Chaudhary on LinkedIn');
    const bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('class', 'bg');
    bg.setAttribute('x', -z); bg.setAttribute('y', -z); bg.setAttribute('width', box); bg.setAttribute('height', box);
    const fg = document.createElementNS(NS, 'path');
    fg.setAttribute('class', 'fg'); fg.setAttribute('d', window.QR.d);
    svg.append(bg, fg); t.append(svg);
    return t;
  }

  function build(s, idx) {
    const kind = idx === 0 ? 'title' : s.prompt ? 'prompt' : s.bigList ? 'big' : 'std';
    const root = el('section', 'slide');
    root.dataset.kind = kind;
    root.dataset.theme = look[idx] || 'ink';
    const [hmin, hmax] = headRange(s, kind);
    root.style.setProperty('--h', hmax + 'px');
    root.dataset.hmin = hmin; root.dataset.hmax = hmax;
    const tex = document.createElement('canvas'); tex.className = 'tex'; root.append(tex);
    const wrap = el('div', 'wrap');
    root.append(wrap);

    const ctx = { t: 0 };
    if (s.kicker) { const k = el('p', 'kicker'); addWords(k, s.kicker, { t: 0, max: 30 }); wrap.append(k); ctx.t = 60; }

    const main = el('div', 'main'), stack = el('div', 'stack');
    main.append(stack); wrap.append(main);

    if (s.headline) {
      const h = el('h1', 'headline');
      ctx.max = 55;
      fillHeadline(h, s.headline, kind, ctx);
      stack.append(h);
    }
    if (s.sub) { const p = el('p', 'sub'); ctx.max = 16; addWords(p, s.sub, ctx); stack.append(p); }

    const mkList = () => {
      const ul = el('ul', 'list');
      s.list.forEach((t, n) => {
        const li = el('li'), num = el('span', 'n'), tx = el('span', 't');
        addWords(num, pad(n + 1), { t: ctx.t, max: 0 });
        ctx.max = 18; addWords(tx, t, ctx);
        li.append(num, tx); ul.append(li);
      });
      return ul;
    };
    const mkExample = () => {
      const a = el('aside', 'example');
      const lab = el('span', 'label'), body = el('span', 'body');
      addWords(lab, s.exampleLabel || 'For example', { t: ctx.t, max: 40 });
      ctx.max = 14; addWords(body, s.example, ctx);
      a.append(lab, body);
      return a;
    };

    if (s.list && s.example) {
      const row = el('div', 'row');
      row.append(mkList(), mkExample());
      stack.append(row);
    } else {
      if (s.list) stack.append(mkList());
      if (s.example) stack.append(mkExample());
    }

    if (s.prompt) {
      const b = el('blockquote', 'prompt'), p = el('p');
      ctx.max = 14; addWords(p, s.prompt, ctx);
      b.append(p); stack.append(b);
    }
    if (s.bigList) {
      const ul = el('ul', 'biglist');
      s.bigList.forEach((t) => { const li = el('li'); ctx.max = 70; addWords(li, t, ctx); ul.append(li); });
      stack.append(ul);
    }
    if (s.foot) { const f = el('p', 'foot'); ctx.max = 14; addWords(f, s.foot, ctx); wrap.append(f); }
    if (s.qr && window.QR) { root.dataset.qr = '1'; wrap.append(qrTile()); }
    /* long copy: keep the whole reveal under ~0.9s */
    const wis = root.querySelectorAll('.wi');
    let mx = 0; wis.forEach((w) => { mx = Math.max(mx, +w.style.getPropertyValue('--d')); });
    if (mx > 900) wis.forEach((w) => w.style.setProperty('--d', Math.round(+w.style.getPropertyValue('--d') * 900 / mx)));
    paintTexture(tex, look[idx] || 'ink', idx, ...dims());
    return root;
  }

  /* responsive text: size the headline as large as the slide allows, then shrink everything else only if still needed */
  function fitSlide(root) {
    const main = root.querySelector('.main'), stack = root.querySelector('.stack');
    const heads = root.querySelectorAll('.headline, .biglist li');
    const over = () =>
      stack.offsetHeight > main.clientHeight + 1 ||
      stack.scrollWidth > main.clientWidth + 1 ||
      [...heads].some((h) => h.scrollWidth > h.clientWidth + parseFloat(getComputedStyle(h).fontSize) * 0.1);
    root.style.setProperty('--k', 1);
    let lo = +root.dataset.hmin, hi = +root.dataset.hmax;
    root.style.setProperty('--h', hi + 'px');
    if (over()) {
      for (let n = 0; n < 9; n++) {
        const mid = (lo + hi) / 2;
        root.style.setProperty('--h', mid + 'px');
        if (over()) hi = mid; else lo = mid;
      }
      root.style.setProperty('--h', lo + 'px');
    }
    let k = 1;
    while (over() && k > 0.55) {
      k = Math.round((k - 0.03) * 100) / 100;
      root.style.setProperty('--k', k);
    }
  }

  /* slide counter: the new number rolls up out of a mask */
  function setCount(i) {
    count.textContent = '';
    const r = el('span', 'roll'), n = el('span', 'rollin');
    n.textContent = pad(i + 1); r.append(n);
    count.append(r, document.createTextNode(' / ' + pad(total)));
  }

  function go(i) {
    i = Math.max(0, Math.min(total - 1, i));
    if (i === cur) return;

    /* the slide on screen stays fully opaque underneath while the new one fades in,
       so colour blocks cross-dissolve without a dark dip */
    const all = [...slot.querySelectorAll('.slide')];
    const old = all[all.length - 1];
    all.forEach((n) => { if (n !== old) n.remove(); });
    if (old) {
      old.style.animation = 'none';
      setTimeout(() => { if (old.isConnected) old.remove(); }, reduced.matches ? 240 : 520);
    }

    const next = build(slides[i], i);
    slot.append(next);
    fitSlide(next);

    cur = i;
    stage.dataset.theme = look[i] || 'ink';
    setCount(i);
    fill.style.transform = 'scaleX(' + (total > 1 ? i / (total - 1) : 1) + ')';
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === total - 1;
    document.title = (slides[i].headline || slides[i].kicker || 'Exploration with AI') + ' — DevFest 2026';

    const h = '#' + (i + 1);
    if (location.hash !== h) {
      try { history.replaceState(null, '', h); } catch (e) { location.hash = h; }
    }
  }
  const next = () => go(cur + 1);
  const prev = () => go(cur - 1);

  /* ── scale the stage to any screen; hold it upright (720×1280) on portrait screens ── */
  function resize() {
    const wantPortrait = innerHeight > innerWidth;
    const changed = wantPortrait !== portrait || !stage.dataset.mode;
    portrait = wantPortrait;
    document.body.classList.toggle('portrait', portrait);
    const [w, h] = dims();
    stage.dataset.mode = portrait ? 'portrait' : 'landscape';
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    stage.style.margin = (-h / 2) + 'px 0 0 ' + (-w / 2) + 'px';
    stage.style.transform = 'scale(' + Math.min(innerWidth / w, innerHeight / h) + ')';
    const ls = $('#ldstage');
    if (ls) ls.style.transform = 'scale(' + Math.min(innerWidth / 1280, innerHeight / 720) + ')';
    if (changed && cur >= 0 && !loading) { const i = cur; cur = -1; go(i); }
  }
  addEventListener('resize', resize);
  document.addEventListener('fullscreenchange', resize);
  resize();

  /* ── fullscreen ── */
  function toggleFS() {
    const d = document, e = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    } else {
      const f = e.requestFullscreen || e.webkitRequestFullscreen;
      if (f) f.call(e).catch(() => {});
    }
  }

  /* ── copy the current prompt (press C) ── */
  function copyPrompt() {
    const p = slides[cur] && slides[cur].prompt;
    if (!p) return;
    const done = () => {
      toast.textContent = 'Prompt copied';
      toast.classList.add('show');
      clearTimeout(copyPrompt.t);
      copyPrompt.t = setTimeout(() => toast.classList.remove('show'), 1400);
    };
    const legacy = () => {
      const ta = document.createElement('textarea');
      ta.value = p; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.append(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(p).then(done, legacy);
    } else legacy();
  }

  /* ── keyboard ── */
  let skipLoader = () => {};
  addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (loading) { e.preventDefault(); skipLoader(); return; }
    switch (e.key) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case 'Enter': case 'n': case 'N':
        e.preventDefault(); next(); break;
      case ' ':
        e.preventDefault(); e.shiftKey ? prev() : next(); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': case 'p': case 'P':
        e.preventDefault(); prev(); break;
      case 'Home': e.preventDefault(); go(0); break;
      case 'End': e.preventDefault(); go(total - 1); break;
      case 'f': case 'F': e.preventDefault(); toggleFS(); break;
      case 'c': case 'C': copyPrompt(); break;
    }
  });

  /* ── buttons ── */
  prevBtn.addEventListener('click', (e) => { prev(); e.currentTarget.blur(); });
  nextBtn.addEventListener('click', (e) => { next(); e.currentTarget.blur(); });

  /* ── touch swipe ── */
  let tx = 0, ty = 0;
  addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; wake();
  }, { passive: true });
  addEventListener('touchend', (e) => {
    if (loading) return;
    const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? next() : prev();
  }, { passive: true });

  /* ── hash sync ── */
  const fromHash = () => {
    const m = location.hash.match(/^#(\d+)$/);
    return m ? Math.max(0, Math.min(total - 1, parseInt(m[1], 10) - 1)) : null;
  };
  addEventListener('hashchange', () => {
    const i = fromHash();
    if (i != null && !loading) go(i);
  });

  /* ── quiet UI: buttons appear on movement, fade when idle ── */
  let idleT;
  function wake() {
    document.body.classList.add('active');
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => {
      document.body.classList.remove('active');
      document.body.classList.add('idle');
    }, 2500);
  }
  addEventListener('mousemove', wake);
  addEventListener('pointerdown', wake);

  /* ── refit when webfonts land ── */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      const s = slot.querySelector('.slide:last-child');
      if (s) fitSlide(s);
    });
  }

  /* ═════════ LOADER ═════════
     Beats (ms). Hard cuts only; the scramble/decode is the motion. */
  const TL = {
    flashAt: [150, 480, 810, 1140],       /* BEAT 1: four single-word flashes */
    flashLen: [220, 220, 220, 400],
    cut: 1620,                             /* BEAT 2: title block begins */
    words: [1700, 2350, 3000],             /*   EXPLORATION · WITH · AI (accent hit) */
    kicker: 4050,                          /* BEAT 3 */
    promise: 4550,
    presenter: 6200,                       /* BEAT 4 */
    end: 6800,
    wipe: 7700,
  };
  const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+/<>?';

  function runLoader(onStart) {
    const L = $('#loader');
    const stat = reduced.matches;

    /* — build — */
    const fx = el('div'); fx.id = 'ldfx';
    const S = el('div'); S.id = 'ldstage';
    L.append(fx, S);
    const ltex = document.createElement('canvas'); ltex.className = 'tex'; S.append(ltex);
    paintTexture(ltex, 'ink', 3);

    const hud = el('div'); hud.id = 'ldhud';
    const cnt = el('span'); cnt.id = 'ldcount'; cnt.textContent = '00';
    const barw = el('span'); barw.id = 'ldbarw';
    const barf = document.createElement('i'); barw.append(barf);
    hud.append(cnt, barw);

    const flash = el('div'); flash.id = 'ldflash'; flash.className = 'ldbig';
    const flashT = document.createElement('span'); flash.append(flashT);

    const main = el('div'); main.id = 'ldmain';
    const title = el('div', 'ldbig'); title.id = 'ldtitle';
    const ln1 = el('div'), ln2 = el('div');
    const tw = loader.title.map((w, i) => {
      const s = el('span', 'tw' + (i === loader.title.length - 1 ? ' hl' : ''), w);
      return s;
    });
    ln1.append(tw[0]); tw.slice(1).forEach((s) => ln2.append(s));
    title.append(ln1, ln2);
    const endBox = el('div', 'ldbig'); endBox.id = 'ldend';
    const endT = document.createElement('span'); endT.style.display = 'inline-block'; endBox.append(endT);
    main.append(title, endBox);

    const kick = el('div', 'ldk'); const prom = el('div', 'ldp'); const pres = el('div', 'ldn');
    const [pName, ...pRest] = loader.presenter.split(' · ');
    pres.append(el('span', 'nm', pName));
    if (pRest.length) pres.append(document.createTextNode(' · ' + pRest.join(' · ')));

    const tick = el('div'); tick.id = 'ldticker';
    const track = el('div', 'track');
    for (let g = 0; g < 2; g++) track.append(el('span', 'tk', loader.ticker.repeat(4)));
    tick.append(track);

    S.append(hud, flash, main, kick, prom, pres, tick);
    resize();

    /* fit a big word so its final text spans maxW (capped) */
    const fit = (box, probe, maxW, cap) => {
      box.style.fontSize = '100px';
      const w = probe.offsetWidth || 1;
      box.style.fontSize = Math.min(cap, (100 * maxW) / w) + 'px';
    };

    /* — decode: letters scramble, then resolve left → right — */
    const decoders = [];
    const decode = (node, text, dur) => {
      const final = typo(text);
      decoders.push({ node, final, dur, t0: performance.now(), last: 0 });
    };
    const stepDecoders = (now) => {
      for (let k = decoders.length - 1; k >= 0; k--) {
        const d = decoders[k], p = (now - d.t0) / d.dur;
        if (p >= 1) { d.node.textContent = d.final; decoders.splice(k, 1); continue; }
        if (now - d.last < 42) continue;
        d.last = now;
        const n = d.final.length;
        let out = '';
        for (let i = 0; i < n; i++) {
          const c = d.final[i];
          if (!/[A-Za-z0-9]/.test(c)) { out += c; continue; }
          out += p >= 0.18 + 0.82 * (i / n) ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0];
        }
        d.node.textContent = out;
      }
    };

    /* — timeline — */
    const ev = [];
    const at = (t, fn) => ev.push({ t, fn });
    const fxOn = () => fx.classList.add('on'), fxOff = () => fx.classList.remove('on');

    loader.flashes.forEach((w, i) => {
      at(TL.flashAt[i], () => {
        flashT.textContent = typo(w);
        fit(flash, flashT, 1000, 240);
        flash.className = 'ldbig on c' + i;
        decode(flashT, w, 150);
      });
      at(TL.flashAt[i] + TL.flashLen[i], () => { flash.className = 'ldbig'; });
    });

    at(TL.cut, () => { fit(title, tw[0], 1104, 150); fxOn(); });
    at(TL.cut + 70, fxOff);
    loader.title.forEach((w, i) => {
      at(TL.words[i], () => {
        tw[i].classList.add('on', 'slam');
        decode(tw[i], w, i === 0 ? 380 : 220);
        if (i === loader.title.length - 1) fxOn();
      });
    });
    at(TL.words[loader.title.length - 1] + 70, fxOff);

    at(TL.kicker, () => { kick.classList.add('on'); decode(kick, loader.kicker, 320); });
    at(TL.promise, () => { prom.classList.add('on'); decode(prom, loader.promise, 900); });
    at(TL.presenter, () => { pres.classList.add('on'); });
    at(TL.end, () => {
      L.dataset.theme = 'fire';
      paintTexture(ltex, 'fire', 5);
      [title, kick, prom].forEach((n) => n.classList.add('gone'));
      endT.textContent = typo(loader.end);
      fit(endBox, endT, 1104, 160);
      endBox.classList.add('on');
      decode(endT, loader.end, 320);
    });
    at(TL.wipe, () => finish(false));
    ev.sort((a, b) => a.t - b.t);

    /* — finish: quick wipe up into slide 1 — */
    let done = false, raf;
    const finish = (fast) => {
      if (done) return;
      done = true;
      cancelAnimationFrame(raf);
      loading = false;
      L.classList.add('wipe');
      if (fast) L.classList.add('fast');
      onStart();
      setTimeout(() => L.remove(), fast ? 260 : 420);
    };
    skipLoader = () => finish(true);
    L.addEventListener('pointerdown', () => finish(true));

    /* — reduced motion: static title + promise + presenter, then go — */
    if (stat) {
      const go_ = () => {
        tw.forEach((n) => { n.classList.add('on'); n.textContent = typo(n.textContent); });
        fit(title, tw[0], 1104, 150);
        kick.classList.add('on'); kick.textContent = typo(loader.kicker);
        prom.classList.add('on'); prom.textContent = typo(loader.promise);
        pres.classList.add('on');
        hud.classList.add('gone');
        setTimeout(() => finish(false), 1500);
      };
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go_);
      return;
    }

    /* — run — */
    let t0 = null;
    const loop = (now) => {
      if (done) return;
      if (t0 == null) t0 = now;
      const t = now - t0;
      const f = Math.min(1, t / TL.wipe);
      cnt.textContent = f >= 1 ? '100' : pad(Math.floor(f * 100));
      barf.style.transform = 'scaleX(' + f + ')';
      while (ev.length && ev[0].t <= t) ev.shift().fn();
      stepDecoders(now);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  }

  /* ── start ── */
  const start = fromHash();
  if ((start != null && start > 0) || portrait) {
    /* deep link (e.g. reload mid-talk) or a phone held upright: skip the intro */
    $('#loader').remove();
    loading = false;
    go(start || 0);
  } else {
    runLoader(() => go(0));
  }
})();
</script>
</body>
</html>
